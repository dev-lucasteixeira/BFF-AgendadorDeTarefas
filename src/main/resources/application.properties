spring.application.name=bff-agendador-tarefas
server.port=8084

usuario.url=http://api-gateway:8080
Agendador-de-Tarefas.url=http://api-gateway:8080/tarefas
notificacao.url=http://notificacao:8083/email

cron.horario=0 0/5 * * * ?

spring.cloud.openfeign.circuitbreaker.enabled=false
resilience4j.circuitbreaker.instances.ms-usuario.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-usuario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-usuario.wait-duration-in-open-state=10s
resilience4j.timelimiter.instances.default.timeout-duration=10s

feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/task-scheduler
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/realms/task-scheduler/protocol/openid-connect/certs