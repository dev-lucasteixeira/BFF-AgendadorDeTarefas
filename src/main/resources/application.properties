spring.application.name=bff-agendador-tarefas

server.port = 8084

usuario.url = http://api-gateway:8080/usuario
Agendador-de-Tarefas.url = http://api-gateway:8080/tarefas
notificacao.url = localhost:8083/email


cron.horario = 0 0/5 * * * ?

usuario.email = admin@admin.com
usuario.senha = 1234

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.instances.ms-usuario.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-usuario.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-usuario.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-usuario.register-health-indicator=true
resilience4j.timelimiter.instances.default.timeout-duration: 10s

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans