version: "3.8"

services:
  agendador-tarefas:
    build: ..\Agendador-de-Tarefas
    container_name: agendador-de-tarefas
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/db_agendador
      - USUARIO_URL=http://api-gateway:8080/usuario
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - mongo
      - usuario
      - redis
      - zipkin

  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador-de-tarefas
    ports:
      - "8084:8084"
    environment:
      - USUARIO_URL=http://api-gateway:8080/usuario
      - AGENDADOR_TAREFAS_URL=http://api-gateway:8080/tarefas
      - NOTIFICACAO_URL=http://notificacao:8083/email
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - api-gateway
      - usuario
      - agendador-tarefas
      - notificacao
      - zipkin

  usuario:
    build: ..\Usuario
    container_name: usuario
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_usuario:5432/db_usuario
      - SPRING_DATASOURCE_USERNAME=admin123
      - SPRING_DATASOURCE_PASSWORD=admin123
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres_usuario
      - redis
      - zipkin

  notificacao:
    build: ..\notificacao
    container_name: notificacao
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_notificacao:5432/db_notificacao
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=1234
      - SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING=true
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - postgres_notificacao
      - zipkin

  redis:
    image: redis:alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
       - "5540:5540"

  postgres_usuario:
    image: postgres:latest
    container_name: postgres_usuario
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin123
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: db_usuario

  postgres_notificacao:
    image: postgres:latest
    container_name: postgres_notificacao
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: db_notificacao

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: db_agendador

  zipkin:
    image: openzipkin/zipkin
    container_name: zipkin
    ports:
      - "9411:9411"

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8085:8080"

  api-gateway:
    build: ../api-gateway
    container_name: api-gateway
    ports:
      - "8088:8080"
    environment:
      - SPRING_CLOUD_COMPATIBILITY_VERIFIER_ENABLED=false
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      - zipkin
      - usuario
      - agendador-tarefas


networks:
  default:
    driver: bridge